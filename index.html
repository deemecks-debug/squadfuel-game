<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SquadFuel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram-adbox.js"></script>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            text-align: center; 
            background-color: #111; 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        .container { width: 90%; max-width: 400px; }
        h1 { color: #f39c12; font-size: 2.5em; margin-bottom: 5px; }
        #user-name { color: #3498db; font-size: 1.2em; margin-bottom: 20px; font-weight: bold; }
        .score { font-size: 3em; font-weight: bold; margin: 20px 0; }
        .fuel-bar { 
            width: 100%; height: 20px; background: #333; 
            border-radius: 10px; overflow: hidden; border: 1px solid #444; 
        }
        #fuel-fill { height: 100%; width: 100%; background: #e67e22; transition: width 0.3s; }
        .btn { 
            width: 100%; padding: 15px; margin: 10px 0; border: none; 
            border-radius: 10px; font-size: 1.2em; font-weight: bold; cursor: pointer; 
        }
        .mine-btn { background: #27ae60; color: white; box-shadow: 0 4px #1e8449; }
        .mine-btn:active { transform: translateY(2px); box-shadow: 0 2px #1e8449; }
        .boost-btn { background: #d35400; color: white; font-size: 1em; }
        .invite-btn { background: #3498db; color: white; font-size: 1em; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>SquadFuel</h1>
        <div id="user-name">Szia, Mecks!</div>
        
        <div class="fuel-bar"><div id="fuel-fill"></div></div>
        <div class="score"><span id="points">0</span> $FUEL</div>

        <button class="btn mine-btn" onclick="mine()">BÁNYÁSZAT</button>
        <button class="btn boost-btn" onclick="showAd()">BOOST ENERGY (+500 $FUEL)</button>
        <button class="btn invite-btn" onclick="inviteFriends()">BARÁTOK MEGHÍVÁSA</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = `Szia, ${user.first_name}!`;
        }

        let points = parseInt(localStorage.getItem('points')) || 0;
        let fuel = 100;
        
        // AdsGram inicializálása a te Block ID-ddal
        const AdController = window.Adsgram.init({ blockId: "23039" });

        function updateUI() {
            document.getElementById('points').innerText = points;
            document.getElementById('fuel-fill').style.width = fuel + "%";
            localStorage.setItem('points', points);
        }

        function mine() {
            if (fuel >= 5) {
                points += 10;
                fuel -= 5;
                updateUI();
            } else {
                tg.showAlert("Elfogyott az üzemanyag! Nézz meg egy reklámot!");
            }
        }

        async function showAd() {
            try {
                // Reklám megnyitása
                await AdController.show();
                // Ha végignézte
                points += 500;
                fuel = 100;
                updateUI();
                tg.showAlert("Boost sikeres! Kaptál 500 $FUEL-t!");
            } catch (e) {
                // Ha még nincs reklám (Adsgram jóváhagyásra vár)
                tg.showAlert("A reklám még nem töltött be. Próbáld újra kicsit később!");
            }
        }

        function inviteFriends() {
            const botUrl = "https://t.me/SquadFuelBot"; // Itt a te botod linkje
            const text = "Gyere és bányássz velem $FUEL-t a SquadFuel játékban!";
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=${encodeURIComponent(text)}`;
            tg.openTelegramLink(shareUrl);
        }

        // Alapértelmezett UI frissítés
        updateUI();
    </script>
</body>
</html>
