<script>
    async function showAd() {
        const adBtn = document.getElementById('ad-button');
        adBtn.innerText = "⌛ LOADING AD...";
        adBtn.disabled = true;

        // Újrainicializálás, ha az első nem sikerült volna
        const controller = window.Adsgram.init({ blockId: "23039" });

        controller.show().then(() => {
            // SIKERES REKLÁM
            multiplier = 2;
            boosts = 10;
            document.getElementById('multiplier-tag').style.display = 'block';
            adBtn.innerText = "📺 WATCH AD (2X REWARD)";
            updateUI();
            
            setTimeout(() => {
                multiplier = 1;
                document.getElementById('multiplier-tag').style.display = 'none';
                adBtn.disabled = false;
            }, 60000);

            tg.showAlert("SUCCESS! 2X REWARD ACTIVE FOR 60s!");
        }).catch((result) => {
            // HIBA VAGY SKIP
            console.error(result);
            adBtn.innerText = "📺 WATCH AD (2X REWARD)";
            adBtn.disabled = false;
            
            let errorMsg = "Ad currently unavailable. Please try again in a few seconds!";
            if (result.error) errorMsg = "Network error or Ad-blocker detected.";
            
            tg.showAlert(errorMsg);
        });
    }
</script>
