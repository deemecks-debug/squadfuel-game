<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SquadFuel - Fixed Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram-adbox.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #001a33; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; }
        .container { width: 90%; max-width: 400px; text-align: center; }
        .logo-area { font-size: 55px; margin-bottom: 5px; filter: drop-shadow(0 0 10px #f1c40f); }
        h1 { font-size: 1.6em; margin: 0 0 10px 0; color: #f1c40f; text-transform: uppercase; }
        .score-container { border: 2px solid #f1c40f; border-radius: 20px; padding: 15px; margin-bottom: 15px; background: rgba(241, 196, 15, 0.1); }
        .score-value { font-size: 3.2em; font-weight: bold; }
        .fuel-bar { width: 100%; height: 25px; background: #333; border-radius: 15px; overflow: hidden; margin-bottom: 5px; border: 1px solid #444; }
        #fuel-fill { height: 100%; background: linear-gradient(90deg, #f1c40f, #f39c12); transition: width 0.3s ease; width: 0%; }
        .btn { width: 100%; padding: 12px; margin: 4px 0; border: none; border-radius: 25px; font-size: 1em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .mine-btn { background: #27ae60; color: white; box-shadow: 0 4px #1e8449; height: 60px; font-size: 1.2em; }
        .mine-btn:active { transform: translateY(2px); box-shadow: 0 2px #1e8449; }
        .ad-btn { background: #f39c12; color: black; font-size: 0.9em; }
        .ad-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .secondary-btn { background: #2980b9; color: white; }
        .wallet-btn { background: #8e44ad; color: white; }
        #multiplier-tag { color: #2ecc71; font-size: 0.8em; font-weight: bold; display: none; margin-bottom: 5px; }
        .rocket-section { margin: 10px 0; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 20px; border: 1px dashed #f1c40f; }
        .rocket-btn { font-size: 45px; transition: 0.1s; display: inline-block; cursor: pointer; }
        .rocket-btn:active { transform: scale(0.8); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-area">🚀</div>
        <h1 id="user-name">SquadFuel</h1>
        <div id="multiplier-tag">⚡ 2X REWARD ACTIVE!</div>
        <div class="score-container">
            <div style="color:#f1c40f; font-size:0.7em; font-weight: bold;">TOTAL $FUEL</div>
            <div id="points" class="score-value">0</div>
        </div>
        <div class="fuel-bar"><div id="fuel-fill"></div></div>
        <div style="font-size: 0.7em; margin-bottom: 10px;">FUEL: <span id="boost-count">10</span>/10</div>
        
        <div class="rocket-section">
            <div class="rocket-btn" onclick="tapRocket()">🚀</div>
            <div style="font-size: 0.8em; color: #f1c40f; font-weight: bold;"><span id="tap-counter">100</span> TAPS TO REFILL</div>
        </div>

        <button class="btn mine-btn" onclick="mine()">⛏ MINE NOW</button>
        <button id="ad-button" class="btn ad-btn" onclick="showAd()">📺 WATCH AD (REFILL + 2X)</button>
        
        <div style="display: flex; gap: 8px;">
            <button class="btn secondary-btn" style="flex: 1;" onclick="inviteFriends()">👥 INVITE</button>
            <button class="btn wallet-btn" style="flex: 1;" onclick="connectWallet()">💳 WALLET</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let points = parseInt(localStorage.getItem('points')) || 0;
        let boosts = parseInt(localStorage.getItem('boosts')) ?? 10;
        let tapsLeft = parseInt(localStorage.getItem('tapsLeft')) || 100;
        let multiplier = 1;

        // ADSGRAM INITIALIZATION
        let AdController = null;
        try {
            AdController = window.Adsgram.init({ blockId: "23039" });
        } catch (e) { console.error("Adsgram init failed"); }

        function updateUI() {
            document.getElementById('points').innerText = points.toLocaleString();
            document.getElementById('boost-count').innerText = boosts;
            document.getElementById('fuel-fill').style.width = (boosts / 10 * 100) + "%";
            document.getElementById('tap-counter').innerText = tapsLeft;
            localStorage.setItem('points', points);
            localStorage.setItem('boosts', boosts);
            localStorage.setItem('tapsLeft', tapsLeft);
        }

        function mine() {
            if (boosts > 0) {
                points += (10 * multiplier);
                boosts -= 1;
                updateUI();
                tg.HapticFeedback.impactOccurred('medium');
            } else {
                tg.showAlert("Out of Fuel! Tap the Rocket!");
            }
        }

        function tapRocket() {
            if (boosts < 10) {
                tapsLeft -= 1;
                if (tapsLeft <= 0) { boosts = 10; tapsLeft = 100; tg.showAlert("🚀 Tank Refilled!"); }
                updateUI();
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        async function showAd() {
            const btn = document.getElementById('ad-button');
            btn.disabled = true;
            btn.innerText = "⌛ LOADING...";

            if (!AdController) {
                tg.showAlert("Ad not ready. Please wait or check your connection.");
                btn.disabled = false;
                btn.innerText = "📺 WATCH AD (REFILL + 2X)";
                return;
            }

            try {
                await AdController.show();
                // SIKERES REKLÁM UTÁN JÁR A JUTALOM
                multiplier = 2;
                boosts = 10;
                document.getElementById('multiplier-tag').style.display = 'block';
                updateUI();
                tg.showAlert("SUCCESS! 2X Reward active for 60s!");
                
                setTimeout(() => {
                    multiplier = 1;
                    document.getElementById('multiplier-tag').style.display = 'none';
                    btn.disabled = false;
                    btn.innerText = "📺 WATCH AD (REFILL + 2X)";
                }, 60000);
            } catch (e) {
                tg.showAlert("Ad skipped or failed to load.");
                btn.disabled = false;
                btn.innerText = "📺 WATCH AD (REFILL + 2X)";
            }
        }

        function inviteFriends() {
            const botUsername = "YOUR_BOT_USERNAME"; // <-- ÍRD BE A BOTOD NEVÉT!
            const inviteLink = `https://t.me/${botUsername}?start=${tg.initDataUnsafe?.user?.id || "ref"}`;
            
            // Csak akkor adunk pontot, ha a Telegram megnyitja a megosztást
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(inviteLink)}&text=${encodeURIComponent("Join my squad and mine $FUEL! 🚀")}`);
            
            // Egy kis várakozás, hogy ne lehessen spammelni
            setTimeout(() => {
                points += 5000;
                updateUI();
                tg.showAlert("🎁 5,000 $FUEL added for your invitation!");
            }, 1000);
        }

        function connectWallet() { tg.showAlert("Wallet integration: Coming Soon!"); }

        const user = tg.initDataUnsafe?.user;
        if (user) document.getElementById('user-name').innerText = user.first_name + "'s Hub";

        updateUI();
    </script>
</body>
</html>
