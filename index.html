<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SquadFuel - Full Version</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #001a33; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; }
        .container { width: 92%; max-width: 420px; text-align: center; }
        .score-container { border: 2px solid #f1c40f; border-radius: 20px; padding: 20px; margin-bottom: 20px; background: rgba(241, 196, 15, 0.1); }
        .score-value { font-size: 3.8em; font-weight: bold; color: #fff; }
        .boost-section { background: rgba(255, 255, 255, 0.05); border: 2px solid #f1c40f; border-radius: 25px; padding: 25px; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; }
        .gas-can-circle { width: 80px; height: 80px; background: #c0392b; border: 4px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 45px; cursor: pointer; box-shadow: 0 0 20px rgba(192, 57, 43, 0.6); transition: transform 0.1s; margin-bottom: 15px; }
        .gas-can-circle:active { transform: scale(0.9); }
        .big-fuel-bar { width: 100%; height: 35px; background: #333; border-radius: 20px; overflow: hidden; border: 2px solid #444; margin-bottom: 10px; }
        #fuel-fill { height: 100%; background: linear-gradient(90deg, #f1c40f, #e67e22); transition: width 0.3s; width: 0%; }
        .btn { width: 100%; padding: 15px; margin: 6px 0; border: none; border-radius: 30px; font-size: 1.1em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
        .mine-btn { background: #27ae60; color: white; box-shadow: 0 5px #1e8449; }
        .ad-btn { background: #f39c12; color: black; }
        .secondary-btn { background: #2980b9; color: white; }
        .wallet-btn { background: #8e44ad; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="user-name">SQUADFUEL HUB</h2>
        <div class="score-container">
            <div style="font-size: 0.8em; color: #f1c40f; font-weight: bold;">TOTAL $FUEL</div>
            <div id="points" class="score-value">0</div>
        </div>
        <div class="boost-section">
            <div class="gas-can-circle" onclick="tapCan()">⛽</div>
            <div class="big-fuel-bar"><div id="fuel-fill"></div></div>
            <div style="font-weight: bold; color: #f1c40f;">FUEL: <span id="boost-count">10</span>/10 | <span id="tap-counter">100</span> TAPS TO REFILL</div>
        </div>
        <button class="btn mine-btn" onclick="mine()">⛏ MINE $FUEL</button>
        <button id="ad-button" class="btn ad-btn" onclick="showAd()">📺 WATCH AD (FULL REFILL)</button>
        <div style="display: flex; gap: 10px;">
            <button class="btn secondary-btn" style="flex: 1;" onclick="inviteFriends()">👥 INVITE</button>
            <button class="btn wallet-btn" style="flex: 1;" onclick="connectWallet()">💳 WALLET</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        let points = parseInt(localStorage.getItem('points')) || 0;
        let boosts = parseInt(localStorage.getItem('boosts')) ?? 10;
        let tapsLeft = 100;
        let lastInviteClaim = parseInt(localStorage.getItem('lastInviteClaim')) || 0;

        const AdController = window.Adsgram.init({ blockId: "23039" });
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp/main/public/tonconnect-manifest.json'
        });

        function updateUI() {
            document.getElementById('points').innerText = points.toLocaleString();
            document.getElementById('boost-count').innerText = boosts;
            document.getElementById('fuel-fill').style.width = (boosts / 10 * 100) + "%";
            document.getElementById('tap-counter').innerText = tapsLeft;
            localStorage.setItem('points', points);
            localStorage.setItem('boosts', boosts);
        }

        function mine() {
            if (boosts > 0) { points += 10; boosts -= 1; updateUI(); tg.HapticFeedback.impactOccurred('medium'); }
            else { tg.showAlert("Out of Fuel! Tap the Gas Can!"); }
        }

        function tapCan() {
            if (boosts < 10) {
                tapsLeft -= 1;
                if (tapsLeft <= 0) { boosts = 10; tapsLeft = 100; tg.showAlert("⛽ Tank Refilled!"); }
                updateUI(); tg.HapticFeedback.impactOccurred('light');
            } else { tg.showAlert("Fuel tank is full!"); }
        }

        async function showAd() {
            const btn = document.getElementById('ad-button');
            btn.disabled = true; btn.innerText = "⌛ LOADING...";
            AdController.show().then(() => {
                boosts = 10; points += 500; updateUI();
                tg.showAlert("✅ Success! Tank refilled + 500 $FUEL!");
            }).catch(() => {
                tg.showAlert("Ad not active yet. Status: Moderation.");
            }).finally(() => { btn.disabled = false; btn.innerText = "📺 WATCH AD (FULL REFILL)"; });
        }

        function inviteFriends() {
            const now = Date.now();
            if (now - lastInviteClaim < 86400000) { tg.showAlert("Invite bonus already claimed today!"); return; }
            const botUrl = "https://t.me/SquadFuelBot?start=" + (tg.initDataUnsafe?.user?.id || "ref");
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=Join me to mine $FUEL!`);
            lastInviteClaim = now; localStorage.setItem('lastInviteClaim', now);
            points += 5000; updateUI();
        }

        async function connectWallet() {
            try { await tonConnectUI.connectWallet(); tg.showAlert("Wallet Connected!"); }
            catch (error) { tg.showAlert("Connection failed."); }
        }
        updateUI();
    </script>
</body>
</html>
