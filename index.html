<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SquadFuel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram-adbox.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #001a33; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { width: 90%; max-width: 400px; text-align: center; position: relative; }
        h1 { font-size: 2.2em; margin-bottom: 10px; font-weight: 900; }
        .score-container { border: 2px solid #f1c40f; border-radius: 20px; padding: 15px; margin-bottom: 25px; }
        .score-label { color: #f1c40f; font-size: 0.8em; letter-spacing: 1px; }
        .score-value { font-size: 3.5em; font-weight: bold; }
        .status-label { color: #f1c40f; font-size: 0.7em; margin-bottom: 5px; text-transform: uppercase; }
        .fuel-bar { width: 100%; height: 35px; background: #333; border-radius: 20px; overflow: hidden; margin-bottom: 5px; border: 1px solid #444; }
        #fuel-fill { height: 100%; width: 100%; background: #f1c40f; transition: width 0.5s ease; }
        .timer-text { font-size: 0.85em; color: #ccc; margin-bottom: 15px; height: 1.2em; }
        .btn { width: 100%; padding: 18px; margin: 8px 0; border: none; border-radius: 30px; font-size: 1.1em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .mine-btn { background: #27ae60; color: white; }
        .boost-btn { background: #f1c40f; color: black; }
        .invite-btn { background: #2c3e50; color: #27ae60; border: 1px solid #27ae60; }
        .wallet-btn { background: none; color: #666; font-size: 0.8em; margin-top: 25px; text-decoration: underline; border: none; cursor: pointer; }
        #plus-one { position: absolute; color: #f1c40f; font-weight: bold; font-size: 2em; opacity: 0; top: 40%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 100; }
        .animate-up { animation: floatUp 1s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 0); } 50% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -100px); } }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="welcome-text">Welcome, Mecks!</h1>
        <div class="score-container">
            <div class="score-label">$FUEL BALANCE</div>
            <div class="score-value" id="points">0</div>
        </div>
        <div class="status-label">Tank Status</div>
        <div class="fuel-bar"><div id="fuel-fill"></div></div>
        <div id="plus-one">+1</div>
        <div class="timer-text" id="timer-display">Következő ingyen Boost: 30s</div>
        <button class="btn mine-btn" onclick="mine()">⛏ BÁNYÁSZAT</button>
        <button class="btn boost-btn" onclick="showAd()">🚀 BOOST ENERGY (<span id="boost-count">10</span>/10)</button>
        <button class="btn invite-btn" onclick="inviteFriends()">👥 INVITE FRIENDS</button>
        <button class="wallet-btn">💳 CONNECT WALLET</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let points = parseInt(localStorage.getItem('points')) || 0;
        let boosts = 10;
        let maxBoosts = 10;
        let timeLeft = 30;
        let timerRunning = false;

        const AdController = window.Adsgram.init({ blockId: "23039" });

        function updateUI() {
            document.getElementById('points').innerText = points.toLocaleString();
            const fuelPercent = (boosts / maxBoosts) * 100;
            document.getElementById('fuel-fill').style.width = fuelPercent + "%";
            document.getElementById('boost-count').innerText = boosts;
            localStorage.setItem('points', points);
        }

        function mine() {
            if (boosts > 0) {
                points += 10;
                boosts -= 1;
                updateUI();
                if (!timerRunning) startTimer();
            } else {
                tg.showAlert("Elfogyott a Boost! Várj vagy nézz reklámot!");
            }
        }

        function startTimer() {
            if (timerRunning) return;
            timerRunning = true;
            
            const timerInterval = setInterval(() => {
                if (boosts < maxBoosts) {
                    timeLeft--;
                    document.getElementById('timer-display').innerText = `Következő ingyen Boost: ${timeLeft}s`;
                    
                    if (timeLeft <= 0) {
                        boosts++;
                        timeLeft = 30;
                        showPlusOne();
                        updateUI();
                    }
                } else {
                    document.getElementById('timer-display').innerText = "TANK FULL (MAX)";
                    clearInterval(timerInterval);
                    timerRunning = false;
                    timeLeft = 30;
                }
            }, 1000);
        }

        function showPlusOne() {
            const el = document.getElementById('plus-one');
            el.classList.add('animate-up');
            setTimeout(() => el.classList.remove('animate-up'), 1000);
        }

        async function showAd() {
            try {
                await AdController.show();
                boosts = maxBoosts;
                timeLeft = 30;
                updateUI();
                tg.showAlert("Boost feltöltve!");
            } catch (e) {
                tg.showAlert("A reklám még nem elérhető. Próbáld újra később!");
            }
        }

        function inviteFriends() {
            const shareUrl = `https://t.me/share/url?url=https://t.me/SquadFuelBot&text=Bányássz velem $FUEL-t!`;
            tg.openTelegramLink(shareUrl);
        }

        // Felhasználónév beállítása
        const user = tg.initDataUnsafe?.user;
        if (user) document.getElementById('welcome-text').innerText = `Welcome, ${user.first_name}!`;

        updateUI();
        if (boosts < maxBoosts) startTimer();
    </script>
</body>
</html>
