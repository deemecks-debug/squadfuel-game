<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SquadFuel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram-adbox.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #001a33; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { width: 90%; max-width: 400px; text-align: center; position: relative; }
        h1 { font-size: 2.2em; margin-bottom: 10px; font-weight: 900; }
        .score-container { border: 2px solid #f1c40f; border-radius: 20px; padding: 15px; margin-bottom: 25px; }
        .score-label { color: #f1c40f; font-size: 0.8em; letter-spacing: 1px; }
        .score-value { font-size: 3.5em; font-weight: bold; }
        .status-label { color: #f1c40f; font-size: 0.7em; margin-bottom: 5px; text-transform: uppercase; }
        .fuel-bar { width: 100%; height: 35px; background: #333; border-radius: 20px; overflow: hidden; margin-bottom: 5px; border: 1px solid #444; }
        #fuel-fill { height: 100%; width: 0%; background: #f1c40f; transition: width 0.3s ease; }
        .timer-text { font-size: 0.85em; color: #ccc; margin-bottom: 15px; height: 1.2em; }
        .btn { width: 100%; padding: 18px; margin: 8px 0; border: none; border-radius: 30px; font-size: 1.1em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .mine-btn { background: #27ae60; color: white; }
        .boost-btn { background: #f1c40f; color: black; }
        .invite-btn { background: #2c3e50; color: #27ae60; border: 1px solid #27ae60; }
        .wallet-btn { background: none; color: #666; font-size: 0.8em; margin-top: 25px; text-decoration: underline; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="welcome-text">Welcome, Mecks!</h1>
        <div class="score-container">
            <div class="score-label">$FUEL BALANCE</div>
            <div id="points" class="score-value">Loading...</div>
        </div>
        <div class="status-label">Tank Status</div>
        <div class="fuel-bar"><div id="fuel-fill"></div></div>
        <div class="timer-text" id="timer-display">Számláló indítása...</div>
        <button class="btn mine-btn" onclick="mine()">⛏ BÁNYÁSZAT</button>
        <button class="btn boost-btn" onclick="showAd()">🚀 BOOST ENERGY (<span id="boost-count">0</span>/10)</button>
        <button class="btn invite-btn" onclick="inviteFriends()">👥 INVITE FRIENDS</button>
        <button class="wallet-btn">💳 CONNECT WALLET</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 1. ADATOK BETÖLTÉSE AZONNAL A LOCALSTORAGE-BÓL
        let points = parseInt(localStorage.getItem('points')) || 0;
        let boosts = parseInt(localStorage.getItem('boosts'));
        if (isNaN(boosts)) boosts = 10;
        let lastUpdate = parseInt(localStorage.getItem('lastUpdate')) || Date.now();
        
        const maxBoosts = 10;
        const cooldown = 30000; // 30 másodperc

        const AdController = window.Adsgram.init({ blockId: "23039" });

        function updateUI() {
            // Megjelenítjük a mentett pontokat
            document.getElementById('points').innerText = points.toLocaleString();
            document.getElementById('boost-count').innerText = boosts;
            document.getElementById('fuel-fill').style.width = (boosts / maxBoosts * 100) + "%";
            
            // Mentés
            localStorage.setItem('points', points);
            localStorage.setItem('boosts', boosts);
            localStorage.setItem('lastUpdate', lastUpdate);
        }

        function mine() {
            if (boosts > 0) {
                points += 10;
                // Csak az első csökkenésnél rögzítjük az időt a regeneráláshoz
                if (boosts === maxBoosts) {
                    lastUpdate = Date.now();
                }
                boosts -= 1;
                updateUI();
            } else {
                tg.showAlert("Várj, amíg újratölt a tank!");
            }
        }

        // 2. A SZÁMLÁLÓ LOGIKA: MINDIG FUT
        function startRegeneration() {
            setInterval(() => {
                const now = Date.now();
                
                if (boosts < maxBoosts) {
                    const elapsed = now - lastUpdate;
                    const regened = Math.floor(elapsed / cooldown);
                    
                    if (regened > 0) {
                        boosts = Math.min(maxBoosts, boosts + regened);
                        // Csak a maradék időt hagyjuk meg a következő +1-hez
                        lastUpdate = lastUpdate + (regened * cooldown);
                        updateUI();
                    }

                    // Kiszámoljuk a kijelzőhöz a hátralévő másodperceket (30-tól lefelé)
                    const nextInMs = cooldown - (elapsed % cooldown);
                    const seconds = Math.ceil(nextInMs / 1000);
                    
                    if (boosts < maxBoosts) {
                        document.getElementById('timer-display').innerText = `Következő ingyen Boost: ${seconds}s`;
                    } else {
                        document.getElementById('timer-display').innerText = "TANK FULL (MAX)";
                    }
                } else {
                    document.getElementById('timer-display').innerText = "TANK FULL (MAX)";
                    lastUpdate = now; // Folyamatosan frissítjük, amíg tele van
                }
            }, 1000);
        }

        async function showAd() {
            try {
                await AdController.show();
                boosts = maxBoosts;
                lastUpdate = Date.now();
                updateUI();
                tg.showAlert("Boost sikeresen újratöltve!");
            } catch (e) {
                tg.showAlert("A reklám jelenleg nem érhető el.");
            }
        }

        function inviteFriends() {
            tg.openTelegramLink("https://t.me/share/url?url=https://t.me/SquadFuelBot&text=Bányássz velem $FUEL-t!");
        }

        // Felhasználónév beállítása
        const user = tg.initDataUnsafe?.user;
        if (user) document.getElementById('welcome-text').innerText = `Welcome, ${user.first_name}!`;

        // INDÍTÁS
        updateUI();
        startRegeneration();
    </script>
</body>
</html>
