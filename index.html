<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SquadFuel - Final Fix</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram-adbox.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #001a33; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; }
        .container { width: 90%; max-width: 400px; text-align: center; }
        .logo-area { font-size: 50px; margin-bottom: 5px; }
        h1 { font-size: 1.5em; margin: 0 0 10px 0; color: #f1c40f; }
        .score-container { border: 2px solid #f1c40f; border-radius: 20px; padding: 15px; margin-bottom: 15px; background: rgba(241, 196, 15, 0.1); }
        .score-value { font-size: 3em; font-weight: bold; }
        .fuel-bar { width: 100%; height: 25px; background: #333; border-radius: 15px; overflow: hidden; margin-bottom: 5px; border: 1px solid #444; }
        #fuel-fill { height: 100%; background: linear-gradient(90deg, #f1c40f, #f39c12); transition: width 0.3s ease; width: 0%; }
        .btn { width: 100%; padding: 12px; margin: 4px 0; border: none; border-radius: 25px; font-size: 1em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .mine-btn { background: #27ae60; color: white; box-shadow: 0 4px #1e8449; height: 60px; }
        .ad-btn { background: #f39c12; color: black; }
        .ad-btn:disabled { opacity: 0.6; filter: grayscale(1); }
        .secondary-btn { background: #2980b9; color: white; }
        .wallet-btn { background: #8e44ad; color: white; }
        .rocket-section { margin: 10px 0; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 20px; border: 1px dashed #f1c40f; }
        .rocket-btn { font-size: 40px; cursor: pointer; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-area">🚀</div>
        <h1 id="user-name">SquadFuel Hub</h1>
        <div id="multiplier-tag" style="display:none; color:#2ecc71; font-weight:bold;">⚡ 2X REWARD ACTIVE!</div>
        <div class="score-container">
            <div id="points" class="score-value">0</div>
        </div>
        <div class="fuel-bar"><div id="fuel-fill"></div></div>
        <div style="font-size: 0.7em; margin-bottom: 10px;">FUEL: <span id="boost-count">10</span>/10</div>
        
        <div class="rocket-section">
            <div class="rocket-btn" onclick="tapRocket()">🚀</div>
            <div style="font-size: 0.8em; color:#f1c40f;"><span id="tap-counter">100</span> TAPS TO REFILL</div>
        </div>

        <button class="btn mine-btn" onclick="mine()">⛏ MINE $FUEL</button>
        <button id="ad-button" class="btn ad-btn" onclick="showAd()">📺 WATCH AD (REFILL + 2X)</button>
        
        <div style="display: flex; gap: 8px;">
            <button class="btn secondary-btn" style="flex: 1;" onclick="inviteFriends()">👥 INVITE</button>
            <button class="btn wallet-btn" style="flex: 1;" onclick="connectWallet()">💳 WALLET</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let points = parseInt(localStorage.getItem('points')) || 0;
        let boosts = parseInt(localStorage.getItem('boosts')) ?? 10;
        let tapsLeft = 100;
        let multiplier = 1;

        function updateUI() {
            document.getElementById('points').innerText = points.toLocaleString();
            document.getElementById('boost-count').innerText = boosts;
            document.getElementById('fuel-fill').style.width = (boosts / 10 * 100) + "%";
            document.getElementById('tap-counter').innerText = tapsLeft;
            localStorage.setItem('points', points);
            localStorage.setItem('boosts', boosts);
        }

        function mine() {
            if (boosts > 0) {
                points += (10 * multiplier); boosts -= 1;
                updateUI(); tg.HapticFeedback.impactOccurred('medium');
            } else { tg.showAlert("Out of Fuel!"); }
        }

        function tapRocket() {
            if (boosts < 10) {
                tapsLeft -= 1;
                if (tapsLeft <= 0) { boosts = 10; tapsLeft = 100; tg.showAlert("🚀 Refilled!"); }
                updateUI(); tg.HapticFeedback.impactOccurred('light');
            }
        }

        async function showAd() {
            const btn = document.getElementById('ad-button');
            btn.disabled = true; btn.innerText = "⌛ CONNECTING...";

            // Kényszerített újratöltés
            const AdBox = window.Adsgram.init({ blockId: "23039" });

            AdBox.show().then(() => {
                multiplier = 2; boosts = 10;
                document.getElementById('multiplier-tag').style.display = 'block';
                updateUI();
                tg.showAlert("✅ 2X Reward active for 60s!");
                setTimeout(() => {
                    multiplier = 1; btn.disabled = false;
                    document.getElementById('multiplier-tag').style.display = 'none';
                    btn.innerText = "📺 WATCH AD (REFILL + 2X)";
                }, 60000);
            }).catch((err) => {
                tg.showAlert("Ad Error: " + (err.error || "No ads available in your region."));
                btn.disabled = false; btn.innerText = "📺 WATCH AD (REFILL + 2X)";
            });
        }

        function inviteFriends() {
            const botUsername = "YOUR_BOT_USERNAME"; // CSERÉLD KI!
            const inviteLink = `https://t.me/${botUsername}?start=${tg.initDataUnsafe?.user?.id || "ref"}`;
            
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(inviteLink)}&text=Join me!`);

            // Megerősítő ablak, hogy ne adjon pontot csak úgy
            tg.showPopup({
                title: 'Claim Bonus',
                message: 'Did you send the invitation?',
                buttons: [
                    {id: 'sent', type: 'default', text: 'Yes, I sent it!'},
                    {type: 'cancel', text: 'Not yet'}
                ]
            }, (buttonId) => {
                if (buttonId === 'sent') {
                    points += 5000; updateUI();
                    tg.showAlert("🎁 5,000 $FUEL added!");
                }
            });
        }

        function connectWallet() { tg.showAlert("Coming Soon!"); }
        updateUI();
    </script>
</body>
</html>
